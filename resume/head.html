<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #0284c7;
      --text: #1e293b;
      --text-muted: #475569;
      --border: #cbd5e1;
      --bg: #ffffff;
      --tag-bg: #f1f5f9;
      --highlight: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: #f8fafc;
      line-height: 1.26;
      font-size: 8.8pt;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 820px;
      margin: 20px auto;
      background: var(--bg);
      padding: 24px 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border-radius: 4px;
    }

    /* Print styling strictly tuned for single-page A4 */
    @page {
      size: A4;
      margin: 5mm 9mm;
    }

    @media print {
      body {
        background: #ffffff;
      }
      .page {
        margin: 0;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
        max-width: 100%;
      }
      .no-print {
        display: none !important;
      }
      a {
        text-decoration: none !important;
        color: var(--text) !important;
      }
      .print-link {
        color: var(--accent) !important;
      }
    }

    /* Header */
    header {
      text-align: center;
      border-bottom: 1.5px solid var(--primary);
      padding-bottom: 3.5px;
      margin-bottom: 5px;
    }

    h1.name {
      font-size: 16pt;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .contact-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 8.6pt;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .contact-bar a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-bar a:hover {
      text-decoration: underline;
    }

    .summary-text {
      font-size: 8.7pt;
      color: var(--text-muted);
      line-height: 1.26;
      max-width: 98%;
      margin: 0 auto;
    }

    /* Section Styling */
    section {
      margin-bottom: 4.5px;
    }

    .section-title {
      font-size: 9.8pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .section-title span.sub {
      font-size: 8pt;
      font-weight: 500;
      text-transform: none;
      color: var(--text-muted);
      letter-spacing: 0;
    }

    /* Items */
    .item {
      margin-bottom: 3.5px;
    }

    .item:last-child {
      margin-bottom: 2px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 9.2pt;
      margin-bottom: 1.5px;
    }

    .item-title {
      font-weight: 700;
      color: var(--primary);
    }

    .item-title a {
      color: var(--primary);
      text-decoration: none;
    }

    .item-title a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .item-role {
      font-weight: 600;
      color: var(--highlight);
    }

    .item-date {
      font-size: 8.4pt;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .item-stack {
      font-size: 7.8pt;
      color: var(--text-muted);
      margin-bottom: 1.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .item-stack strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Bullets */
    ul.bullets {
      list-style-type: disc;
      padding-left: 14px;
    }

    ul.bullets li {
      font-size: 8.1pt;
      line-height: 1.22;
      color: var(--text);
      margin-bottom: 1px;
      text-align: justify;
    }

    ul.bullets li strong {
      color: var(--primary);
      font-weight: 600;
    }

    /* Skills Grid */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3px;
      font-size: 8.0pt;
      line-height: 1.22;
    }

    .skill-row {
      display: flex;
      line-height: 1.3;
    }

    .skill-label {
      width: 140px;
      font-weight: 700;
      color: var(--primary);
      flex-shrink: 0;
    }

    .skill-vals {
      color: var(--text);
    }

    /* Honors & Badges */
    .honors-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 8.0pt;
      line-height: 1.22;
    }

    .honor-item {
      display: flex;
      justify-content: space-between;
      line-height: 1.3;
    }

    .honor-title strong {
      color: var(--primary);
    }

    .honor-metric {
      font-weight: 700;
      color: var(--highlight);
    }

    .tag {
      display: inline-block;
      background: var(--tag-bg);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 7.6pt;
      font-weight: 600;
      color: var(--accent);
      margin-left: 5px;
      vertical-align: middle;
    }


    .hackathon-roster {
      margin-top: 2px;
      font-size: 7.9pt;
      line-height: 1.24;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 2px;
    }

    .hackathon-roster strong {
      color: var(--primary);
    }

    /* Interactive toolbar for screen viewing */
    .toolbar {
      max-width: 820px;
      margin: 15px auto 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #0f172a;
      color: #fff;
      border-radius: 6px;
      font-size: 9pt;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 8.5pt;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #026aa2;
    }
  </style>
</head>
