description = "Holo, the chat agent on Yao Xiang's portfolio site"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.28", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 120
